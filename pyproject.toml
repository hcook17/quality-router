[project]
name = "quality-router"
version = "0.1.0"
description = "CLI mediator for independent quality constituents (Sonar, Gortex, hooks). Not locked to one agent host. Not an MCP aggregator."
readme = "README.md"
authors = [
    { name = "hcook17", email = "cookhunter20@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
quality-router = "quality_router:main"
qr = "quality_router:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6",
    "ruff>=0.11",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.coverage.run]
branch = true
source_pkgs = ["quality_router"]
omit = ["*/quality_router/__main__.py"]

[tool.coverage.report]
fail_under = 98.7
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
